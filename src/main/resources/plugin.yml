name: XRay
version: 1.0.0
main: cz.xray.XRayPlugin
api-version: '1.21'
description: Admin X-Ray - shows nearby ores and refreshes them every 2 seconds
commands:
  xray:
    description: Toggles X-Ray
    usage: /xray
    permission: xray.use
permissions:
  xray.use:
    description: Allows using /xray
    default: op
