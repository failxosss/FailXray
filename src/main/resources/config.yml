# Radius in blocks
radius: 200
# Update interval in ticks (40 = 2 seconds)
update-interval-ticks: 40
# Maximum number of ores shown at once (nearest ones have priority)
max-entities: 2000
# How many chunks are scanned per tick (higher = faster first scan, more load)
chunks-per-tick: 4
# Give infinite night vision while X-Ray is enabled (removed when disabled)
night-vision: true
